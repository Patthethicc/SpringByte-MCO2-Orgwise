# nginx site for the Orgwise SPA (frontend/Dockerfile copies this to conf.d/default.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS; resolving at request time lets nginx start before the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    # API calls go to the gateway (same origin for the browser, so no CORS needed in compose).
    # The gateway itself blocks /api/v1/internal/**.
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Swagger UI aggregated by the gateway.
    location ~ ^/(swagger-ui|v3/api-docs|webjars) {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router handles every other path.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
